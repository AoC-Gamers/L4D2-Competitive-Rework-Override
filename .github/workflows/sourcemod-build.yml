name: SourceMod Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "channel/*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ vars.SOURCEMOD_VERSION }}

jobs:
  deps-smx:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Validate SourceMod version
        shell: bash
        run: |
          if [[ ! "$SOURCEMOD_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set the AoC-Gamers Actions variable SOURCEMOD_VERSION to a branch such as 1.12."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${SOURCEMOD_VERSION}-${{ hashFiles('scripts/deps/fetch-sourcemod.py', 'scripts/package/package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch SourceMod dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-latest
    needs: deps-smx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX
        run: make build-smx PYTHON=python3 SMX_PLATFORM=linux

      - name: Upload SMX build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: .build/build-smx-compile.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  package:
    runs-on: ubuntu-latest
    needs: build-smx
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}
      release-tag: ${{ steps.artifact.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/smx

      - name: Package SMX tree
        run: make package-smx PYTHON=python3

      - name: Resolve artifact channel
        id: artifact
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#channel/}"
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            version="latest"
            release_tag="channel/latest"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop"
            release_tag="channel/develop"
          else
            version="pr-${GITHUB_SHA::7}"
            release_tag=""
          fi

          {
            echo "basename=l4d2-competitive-rework-override-${version}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Create and validate SourceMod ZIP
        env:
          RELEASE_BASENAME: ${{ steps.artifact.outputs.basename }}
        run: |
          make release PYTHON=python3
          make validate-artifact PYTHON=python3

      - name: Upload release zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.basename }}
          path: dist/release/${{ steps.artifact.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request' && needs.package.outputs.release-tag != ''
    permissions:
      contents: write

    steps:
      - name: Download validated release ZIP
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.basename }}
          path: dist/release

      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.release-tag }}
          files: dist/release/${{ needs.package.outputs.basename }}.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
